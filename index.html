
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgOgh3aCSj5exovMzTrOX_Q9wQIld2AEE",
  authDomain: "yug-fitness-gym.firebaseapp.com",
  projectId: "yug-fitness-gym",
  storageBucket: "yug-fitness-gym.firebasestorage.app",
  messagingSenderId: "295461485643",
  appId: "1:295461485643:web:7984bc8d2cba476fd961ce",
  measurementId: "G-7LRHBQRXME"
};

const OWNER_UID = "7IS102wdyDaBkYboWokkE2ewiHz1";
const WHATSAPP_LINK = "https://chat.whatsapp.com/GxGr1Gans3h9o8XgBR26K7?s=cl&p=a&iam=2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const show = (id, yes=true) => $(id).classList.toggle("hidden", !yes);
const msg = (s, cls="") => {
  $("authMsg").textContent=s;
  $("authMsg").className=cls;
};

const today = () => new Date().toISOString().slice(0,10);
const datePlusMonth = dateStr => {
  const d=new Date(dateStr+"T12:00:00");
  d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
};
const money = n => "₹"+(Number(n||0).toLocaleString("en-IN"));

let currentUser=null, isOwner=false;

// WhatsApp buttons automatically added to the page
function addWhatsAppButtons(){
  if(document.getElementById("yugWhatsAppBtn")) return;

  const a=document.createElement("a");
  a.id="yugWhatsAppBtn";
  a.href=WHATSAPP_LINK;
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.textContent="🟢 Join Yug Fitness Gym WhatsApp Group";

  a.style.cssText=
    "display:block;text-align:center;background:#25D366;color:white;padding:14px;border-radius:12px;margin:12px 16px;text-decoration:none;font-weight:bold;";

  const header=document.querySelector("header");
  if(header) header.appendChild(a);

  const dashboard=document.getElementById("profileCard");
  if(dashboard){
    const b=a.cloneNode(true);
    b.id="yugWhatsAppDashboardBtn";
    dashboard.appendChild(b);
  }
}

addWhatsAppButtons();

$("loginBtn").onclick = async () => {
  try {
    msg("Logging in…");
    await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
    msg("");
  } catch(e) {
    msg(friendly(e),"small error");
  }
};

$("signupBtn").onclick = async () => {
  const email=$("email").value.trim();
  const password=$("password").value;

  if(password.length<6){
    msg("Password kam se kam 6 characters ka rakho.","small error");
    return;
  }

  const name=prompt("Member ka poora naam:");
  if(!name || !name.trim()){
    msg("Naam zaroori hai.","small error");
    return;
  }

  const phone=prompt("Member ka mobile number (optional):")||"";

  try {
    msg("Member account bana rahe hain…");
    const cred=await createUserWithEmailAndPassword(auth,email,password);

    await setDoc(doc(db,"members",cred.user.uid),{
      name:name.trim(),
      email,
      phone:phone.trim(),
      role:"member",
      createdAt:serverTimestamp()
    });

    msg("Signup complete! Ab owner aapki fees set karega.","small success");
  } catch(e) {
    msg(friendly(e),"small error");
  }
};

$("logoutBtn").onclick=()=>signOut(auth);

function friendly(e){
  const map={
    "auth/invalid-credential":"Email ya password sahi nahi hai.",
    "auth/email-already-in-use":"Is email se account pehle se bana hua hai.",
    "auth/weak-password":"Password kam se kam 6 characters ka rakho.",
    "auth/unauthorized-domain":"Firebase Authentication mein website domain authorize karna hoga.",
    "permission-denied":"Database security rules ya account permission check karni hogi."
  };
  return map[e.code] || (e.message||"Kuch error aaya.").replace("Firebase: ","");
}

onAuthStateChanged(auth, async user=>{
  currentUser=user;

  if(!user){
    isOwner=false;
    show("authCard",true);
    show("profileCard",false);
    return;
  }

  show("authCard",false);
  show("profileCard",true);
  $("userEmail").textContent=user.email||"";

  try {
    let adminExists=false;

    // Owner UID verification
    if(user.uid===OWNER_UID){
      adminExists=true;
    } else {
      const adminSnap=await getDoc(doc(db,"admins",user.uid));
      adminExists=adminSnap.exists();
    }

    console.log("LOGIN UID:",user.uid);
    console.log("OWNER STATUS:",adminExists);

    isOwner=adminExists;

    $("welcome").textContent=isOwner?"Owner Dashboard":"Member Dashboard";
    show("ownerPanel",isOwner);
    show("memberPanel",!isOwner);

    if(isOwner){
      await loadOwner();
    } else {
      await loadMember();
    }

  } catch(e) {
    console.error("Dashboard error:",e);
    $("welcome").textContent="Account access issue";
    if($("myDetails")) $("myDetails").textContent=friendly(e);
  }
});

async function loadOwner(){
  const snap=await getDocs(collection(db,"members"));
  let active=0,due=0,html="";
  const now=today();

  snap.forEach(d=>{
    const m=d.data();
    const expiry=m.expiryDate||"";
    const status=expiry && expiry>=now ? "Active" : "Due / not set";

    if(status==="Active")active++;
    else due++;

    html+=`<div class="member">
      <strong>${esc(m.name||"Member")}</strong>
      <span class="pill">${status}</span>
      <p>${esc(m.email||"")} • ${esc(m.phone||"")}</p>
      <p>Monthly fee: ${money(m.monthlyFee)} • Expiry: ${esc(expiry||"Not set")}</p>
      <div class="grid">
        <div>
          <label>Monthly fee (₹)</label>
          <input id="fee-${d.id}" type="number" min="0" value="${Number(m.monthlyFee||0)}">
        </div>
        <div>
          <label>Expiry date</label>
          <input id="expiry-${d.id}" type="date" value="${esc(expiry)}">
        </div>
      </div>
      <button onclick="window.saveMember('${d.id}')">Save fee & expiry</button>
      <button class="secondary" onclick="window.recordPayment('${d.id}')">Record payment</button>
    </div>`;
  });

  $("totalMembers").textContent=snap.size;
  $("activeMembers").textContent=active;
  $("dueMembers").textContent=due;
  $("memberList").innerHTML=html||'<p class="small">Abhi koi member signup nahi hua.</p>';
}

window.saveMember=async id=>{
  try{
    const fee=Number($("fee-"+id).value);
    const expiry=$("expiry-"+id).value;

    if(!Number.isFinite(fee)||fee<0||!expiry){
      alert("Valid fee aur expiry date bharo.");
      return;
    }

    await updateDoc(doc(db,"members",id),{
      monthlyFee:fee,
      expiryDate:expiry,
      updatedAt:serverTimestamp()
    });

    alert("Member fee aur expiry save ho gayi.");
    await loadOwner();
  }catch(e){
    alert(friendly(e));
  }
};

window.recordPayment=async id=>{
  try{
    const fee=Number($("fee-"+id).value);

    if(!Number.isFinite(fee)||fee<=0){
      alert("Pehle valid monthly fee bharo.");
      return;
    }

    const currentExpiry=$("expiry-"+id).value||today();
    const base=currentExpiry<today()?today():currentExpiry;
    const next=datePlusMonth(base);

    await updateDoc(doc(db,"members",id),{
      monthlyFee:fee,
      expiryDate:next,
      lastPaymentAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });

    await addDoc(collection(db,"members",id,"payments"),{
      amount:fee,
      paidAt:serverTimestamp(),
      method:"Owner verified",
      newExpiryDate:next
    });

    alert("Payment record save ho gaya. UPI/bank mein payment pehle verify karna zaroori hai.");
    await loadOwner();
  }catch(e){
    alert(friendly(e));
  }
};

async function loadMember(){
  const ref=doc(db,"members",currentUser.uid);
  const snap=await getDoc(ref);

  if(!snap.exists()){
    $("myDetails").textContent="Member profile nahi mila. Gym owner se contact karein.";
    return;
  }

  const m=snap.data();

  $("myDetails").innerHTML=
    `<strong>${esc(m.name||"Member")}</strong><br>
    Monthly fee: ${money(m.monthlyFee)}<br>
    Expiry date: ${esc(m.expiryDate||"Not assigned")}<br>
    Status: ${m.expiryDate&&m.expiryDate>=today()?"Active":"Due / not set"}`;

  const ps=await getDocs(
    query(collection(db,"members",currentUser.uid,"payments"),orderBy("paidAt","desc"))
  );

  $("myPayments").innerHTML=ps.empty
    ?"No payment records yet."
    :ps.docs.map(p=>`<div class="member">
      ${money(p.data().amount)} • ${esc(p.data().newExpiryDate||"")}<br>
      <span class="small">Owner verified payment</span>
    </div>`).join("");
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}
</script>
